<section class="relative overflow-hidden pt-12 pb-20">
  <div class="absolute inset-0 bg-body dark:bg-darkmode-body -z-20"></div>
  <!-- Modern blurred blobs -->
  <div class="absolute -top-10 -left-10 w-96 h-96 bg-primary/30 dark:bg-primary/20 rounded-full mix-blend-multiply dark:mix-blend-lighten filter blur-[100px] opacity-70 -z-10"></div>
  <div class="absolute -top-10 -right-10 w-96 h-96 bg-orange-400/20 dark:bg-orange-400/10 rounded-full mix-blend-multiply dark:mix-blend-lighten filter blur-[100px] opacity-70 -z-10"></div>
  
  <div class="container mx-auto px-4 relative z-10 text-center">
    <div class="bg-theme-light/60 dark:bg-darkmode-theme-light/40 backdrop-blur-xl border border-white/50 dark:border-white/10 shadow-lg rounded-3xl p-10 lg:p-16 max-w-4xl mx-auto transform transition-all hover:scale-[1.01] hover:shadow-xl">
      <h1 class="text-4xl lg:text-5xl font-extrabold text-dark dark:text-darkmode-dark">{{ T (printf "%s" (lower .Title)) | default .Title | title }}</h1>
      {{ partial "components/breadcrumb" (dict "Context" . "Class" "mt-6 flex justify-center") }}
    </div>
  </div>
</section>
