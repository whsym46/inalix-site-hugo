<div class="bg-body dark:bg-darkmode-body flex flex-col h-full">
  {{ $image := .Params.image }}
  {{ if $image }}
  {{ partial "image" (dict "Src" $image "Context" .Page "Alt" .Title "Class" "mb-6 w-full rounded object-cover h-48") }}
  {{ end }}

  <h4 class="mb-3 pt-4">
    <a href="{{ .RelPermalink }}">
      {{ .Title }}
    </a>
  </h4>

  <p class="mb-6 flex-grow">
    {{ .Params.description | default .Summary | truncate 180 }}
  </p>

  <div class="mt-auto">
    <a class="btn btn-outline-primary btn-sm" href="{{ .RelPermalink }}">
      {{ default "Read More" (T "read_more") }}
    </a>
  </div>
</div>
